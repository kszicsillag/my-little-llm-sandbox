version: 2
updates:
  # Sandbox base image digest (FROM ...@sha256:...). Rebuild the disk image after merging:
  #   .sandbox/sbx.sh image   (with a new SBX_IMAGE name, e.g. agent-base-v2)
  - package-ecosystem: docker
    directories: ["/.sandbox/image"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "sandbox-image"

  # OpenTofu providers (infra/.terraform.lock.hcl)
  - package-ecosystem: terraform
    directories: ["/infra"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "infra"
